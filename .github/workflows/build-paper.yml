name: Verify reproducible technical-v1 PDF

on:
  push:
    branches:
      - "main"
    paths:
      - "paper/preprint_v1.tex"
      - "paper/references.bib"
      - "paper/preprint_v1.pdf"
      - "RELEASE.json"
      - ".github/workflows/build-paper.yml"
  pull_request:
    paths:
      - "paper/preprint_v1.tex"
      - "paper/references.bib"
      - "paper/preprint_v1.pdf"
      - "RELEASE.json"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1790812800"
      FORCE_SOURCE_DATE: "1"
      TZ: "UTC"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preserve frozen PDF
        run: cp paper/preprint_v1.pdf /tmp/preprint-frozen.pdf

      - name: Build PDF first pass
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3 / 3.3.0
        with:
          root_file: preprint_v1.tex
          working_directory: paper

      - name: Preserve first build and clean generated files
        run: |
          cp paper/preprint_v1.pdf /tmp/preprint-first.pdf
          rm -f \
            paper/preprint_v1.pdf \
            paper/preprint_v1.aux \
            paper/preprint_v1.bbl \
            paper/preprint_v1.blg \
            paper/preprint_v1.log \
            paper/preprint_v1.out \
            paper/preprint_v1.fls \
            paper/preprint_v1.fdb_latexmk

      - name: Build PDF second pass
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3 / 3.3.0
        with:
          root_file: preprint_v1.tex
          working_directory: paper

      - name: Verify reproducibility and frozen PDF
        run: |
          cmp /tmp/preprint-first.pdf paper/preprint_v1.pdf
          cmp /tmp/preprint-frozen.pdf paper/preprint_v1.pdf
          actual="$(sha256sum paper/preprint_v1.pdf | awk '{print $1}')"
          expected="$(python - <<'PY'
          import json
          print(json.load(open('RELEASE.json'))['technical_preprint']['pdf_sha256'])
          PY
          )"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"
